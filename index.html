<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Herramientas pequeñas para negocios y deporte: cada una resuelve una tarea concreta, corre en el navegador y guarda los datos en tu equipo."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23171a26'/%3E%3Cpath d='M9 9v14M23 9v14M9 16h14' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Herramientas</title>
    <!--
      Pone el tema antes de que se pinte la página, para que no se vea un destello del
      tema equivocado. Es la misma regla de shared/tema.ts: si cambia una, cambia la otra.
    -->
    <script>
      ;(() => {
        let guardado = null
        try {
          guardado = localStorage.getItem('herramientas:tema:v1')
        } catch {}
        const elegido = guardado === 'claro' || guardado === 'oscuro'
        const oscuro = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = elegido ? guardado : oscuro ? 'oscuro' : 'claro'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
